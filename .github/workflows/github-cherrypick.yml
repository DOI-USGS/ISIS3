name: GH Cherrypick bugfixes/features for LTS/Prod

env:
  ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}

on:
  push:
    branches:
      - ci-test-target
jobs:

  # Check if the PR is a bugfix/feature
  check_labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    name: Check PR labels action step
    # Make the output of this job available to other jobs
    outputs: 
      result: ${{steps.execute_py_script.outputs.result}}
    steps:
    - name: Checkout files (only the PR Label Checker)
      uses: actions/checkout@v4
      with:
        sparse-checkout: 
          .github/pr_label_checker.py
        sparse-checkout-cone-mode: false
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r ./.github/requirements.txt
    - name: Output Result
      id: execute_py_script
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_API_URL: ${{ secrets.GITHUB_API_URL }}
        GITHUB_SERVER_URL: ${{ secrets.GITHUB_SERVER_URL }}
        GITHUB_SHA: ${{ secrets.GITHUB_SHA }}
      run: |
        echo "result=$(python ./.github/pr_label_checker.py)" >> "$GITHUB_OUTPUT"
        echo "${{ steps.execute_py_script.outputs.result }}"


  build-lts:
    needs: check_labels
    # Only run this step if the code was a bugfix
    if: contains(needs.check_labels.outputs.result, 'bugfix_')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0} # bash login mode so conda can auto activate isis env
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: 9.0
      - name: Cherry Pick
        run: echo "TODO Cherry Pick" # git cherry-pick -m 1 ${{ secrets.GITHUB_SHA }}
      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: isis
          environment-file: environment.yml
          auto-activate-base: true
      - name: Check Environment (Debug)
        env: 
          ISISROOT: ${{ GITHUB_WORKSPACE }}/build
        run: |
          echo "Conda Env"
          conda info --envs
          echo "cmake Location (Should be in isis conda env)"
          which cmake
          echo "Working Directory"
          pwd
          echo "Files"
          ls
          echo "ISISROOT"
          echo $ISISROOT
      - name: Build ISIS
        run: |
          mkdir build
          cd build
          # TODO cmake -GNinja -DJP2KFLAG=ON ../isis
          # TODO ninja -j8
      - name: Push to LTS branch
        run: echo "TODO Push to LTS branch if successful"

